# The app is built here, in the open, from this code — never on someone's computer — and signed with the studio's key,
# which lives only in the repository's secrets. Every build checks that the signature is exactly the published one.
# A tag v* makes a release: Pushishi.apk, SHA256SUMS.txt and a provenance attestation from GitHub.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # the SHA-256 of the signing certificate (public; the same as in README)
  CERT_SHA256: e3dc761c6af8d30b46196b6abf87d42bb3c18feb3850e93ad6b3b56e371ee891

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/key.p12"
          alias=$(keytool -list -keystore "$RUNNER_TEMP/key.p12" -storetype PKCS12 -storepass "$SIGNING_KEY_PASSWORD" | grep PrivateKeyEntry | head -1 | cut -d, -f1)
          test -n "$alias"
          echo "SIGNING_KEY_FILE=$RUNNER_TEMP/key.p12" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Check the signature
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -qi "certificate SHA-256 digest: $CERT_SHA256" certs.txt
          rm -f "$RUNNER_TEMP/key.p12"

      - name: SHA-256
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/Pushishi.apk
          (cd out && sha256sum Pushishi.apk > SHA256SUMS.txt)
          echo "SHA-256: $(cat out/SHA256SUMS.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(stat -c %s out/Pushishi.apk) bytes" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Pushishi
          path: out/

      - name: Attest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/Pushishi.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Pushishi.apk
            out/SHA256SUMS.txt
